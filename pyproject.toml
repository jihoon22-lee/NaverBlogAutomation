[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "naver-blog-assistant"
version = "0.1.0"
description = "Human-in-the-loop AI comment assistant for Naver Blog"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=2.45,<3",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.59,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "ty>=0.0.56,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naver_blog_assistant"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["naver_blog_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = true

