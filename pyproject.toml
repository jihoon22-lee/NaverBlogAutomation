[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "naver-blog-assistant"
version = "0.3.0"
description = "Human-in-the-loop AI comment assistant for Naver Blog"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.139.1,<1",
    "openai>=2.45,<3",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51.0,<1",
]

[project.scripts]
naver-blog-api = "naver_blog_assistant.api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "ty>=0.0.56,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naver_blog_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"docs/api/openapi.yaml" = "naver_blog_assistant/api/openapi.yaml"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=naver_blog_assistant --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live_openai: opt-in test that makes a real OpenAI API request"]

[tool.coverage.run]
branch = true
source = ["naver_blog_assistant"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
