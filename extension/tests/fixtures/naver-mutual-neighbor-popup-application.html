<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Sanitized Naver mutual-neighbor application popup fixture</title>
  </head>
  <body>
    <form name="buddyApplyFrm">
      <input name="blogId" type="hidden" value="candidate" />
      <input name="relation" type="hidden" value="1" />
      <a class="present_selected _selectedGroup" href="https://blog.naver.com/">새 그룹</a>
      <div class="dropdown_select _groupList" role="listbox">
        <a aria-selected="true" class="item _selectGroup" groupid="1" href="https://blog.naver.com/" role="option">새 그룹</a>
        <a aria-selected="false" class="item _selectGroup" groupid="2" href="https://blog.naver.com/" role="option">의학</a>
      </div>
      <textarea class="text_box _bothBuddyAddMessage" id="message" name="message"></textarea>
      <a class="button_next _addBothBuddy" href="https://blog.naver.com/">다음</a>
    </form>
  </body>
</html>
