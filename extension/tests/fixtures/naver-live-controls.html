<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Sanitized Naver Blog controls fixture</title>
  </head>
  <body>
    <main>
      <div class="wrap_postcomment">
        <div class="area_sympathy">
          <div class="my_reaction">
            <div
              class="u_likeit_list_module _reactionModule _reactionModule_BLOG"
              data-cid="sanitized_1"
            >
              <!-- biome-ignore lint/a11y/useSemanticElements: Sanitized fixture mirrors Naver's control. -->
              <a
                class="u_likeit_button _face off"
                href="https://blog.naver.com/"
                role="button"
                aria-pressed="false"
              >공감</a>
            </div>
          </div>
        </div>
        <button class="other_reaction" type="button">
          <div class="u_likeit_list_module _reactionModule _reactionModule_BLOG" data-cid="sanitized_1">
            <span class="u_likeit_button _face off">공감</span>
          </div>
        </button>
        <div id="area_sympathysanitized_1" class="area_sympathy">
          <div class="my_reaction">
            <div
              class="u_likeit_list_module _reactionModule _reactionModule_BLOG"
              data-cid="sanitized_1"
            >
              <!-- biome-ignore lint/a11y/useSemanticElements: Sanitized fixture mirrors Naver's control. -->
              <a
                id="canonical-like"
                class="u_likeit_button _face off"
                href="https://blog.naver.com/"
                role="button"
                aria-haspopup="true"
                aria-pressed="false"
                aria-expanded="false"
                data-label="news"
                data-isopenfacelayer="false"
                data-like-click-area="face.release"
              >공감</a>
              <ul id="canonical-like-layer" hidden>
                <li>
                  <!-- biome-ignore lint/a11y/useAriaPropsSupportedByRole: Sanitized fixture mirrors Naver's reaction item. -->
                  <a
                    id="canonical-default-like"
                    class="u_likeit_list_button _button off"
                    href="https://blog.naver.com/"
                    role="menuitem"
                    aria-selected="false"
                    aria-pressed="false"
                    data-type="like"
                    data-like-click-area="normal.like"
                  >공감</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <button class="other_reaction" type="button">
          <div class="u_likeit_list_module _reactionModule _reactionModule_BLOG" data-cid="sanitized_1">
            <span class="u_likeit_button _face off">공감</span>
          </div>
        </button>
      </div>

      <a class="btn btn_add_nb _addBuddyPop _rosRestrictAll" href="https://blog.naver.com/">이웃추가</a>
      <a id="canonical-neighbor" class="btn_buddy btn_addbuddy pcol2 _buddy_popup_btn _returnFalse _rosRestrictAll" href="https://blog.naver.com/">이웃추가</a>
      <div style="display: none">
        <a class="btn_add_buddy _addBuddy" href="https://blog.naver.com/">이웃추가</a>
      </div>
    </main>
  </body>
</html>
