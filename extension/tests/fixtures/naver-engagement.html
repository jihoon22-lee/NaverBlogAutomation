<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>합성 교류 글</title>
  </head>
  <body>
    <main class="se-main-container">
      <h1 class="se-title-text">합성 교류 글</h1>
      <p class="se-text-paragraph">공감과 댓글, 서로이웃 신청의 단건 승인 흐름을 검증하는 충분히 긴 합성 본문입니다.</p>
      <button class="u_likeit_list_btn off" aria-pressed="false" type="button">공감</button>
      <form class="u_cbox_write_area">
        <div class="u_cbox_text u_cbox_text_mention" contenteditable="true"></div>
        <button class="u_cbox_btn_upload" type="button">등록</button>
      </form>
      <div class="u_cbox_comment_list"></div>
      <button class="btn_add_buddy" type="button">이웃추가</button>
      <form id="buddyAddForm" hidden>
        <label><input id="both_buddy" name="relation" type="radio" value="both" />서로이웃</label>
        <textarea id="message"></textarea>
        <button class="btn_ok" type="button">신청</button>
      </form>
      <p class="notice" role="status"></p>
    </main>
    <script>
      const mode = new URL(location.href).searchParams.get("mode") ?? "success";
      const like = document.querySelector(".u_likeit_list_btn");
      const input = document.querySelector(".u_cbox_text");
      const publish = document.querySelector(".u_cbox_btn_upload");
      const comments = document.querySelector(".u_cbox_comment_list");
      const neighbor = document.querySelector(".btn_add_buddy");
      const buddyForm = document.querySelector("#buddyAddForm");
      const buddySubmit = document.querySelector(".btn_ok");
      const notice = document.querySelector(".notice");

      like.addEventListener("click", () => {
        like.classList.replace("off", "on");
        like.setAttribute("aria-pressed", "true");
      });
      publish.addEventListener("click", () => {
        if (mode === "unconfirmed") return;
        const comment = document.createElement("div");
        comment.className = "u_cbox_comment";
        comment.textContent = input.textContent;
        comments.append(comment);
        input.textContent = "";
      });
      neighbor.addEventListener("click", () => {
        buddyForm.hidden = false;
      });
      buddySubmit.addEventListener("click", () => {
        notice.textContent = "서로이웃 신청이 완료되었습니다.";
        buddyForm.hidden = true;
      });
    </script>
  </body>
</html>
