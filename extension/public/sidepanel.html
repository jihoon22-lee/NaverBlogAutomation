<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이버 블로그 댓글 추천</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main id="app" aria-labelledby="page-title" aria-busy="true">
      <header class="page-header">
        <p class="eyebrow">Naver Blog Comment Assistant</p>
        <h1 id="page-title">댓글 추천</h1>
        <p class="purpose">현재 글을 바탕으로 댓글 후보를 만들고 직접 검토해 사용합니다.</p>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">본문을 확인하고 있습니다.</p>

      <section id="error-panel" class="card error" role="alert" hidden aria-labelledby="error-title">
        <h2 id="error-title" tabindex="-1">작업을 완료하지 못했습니다</h2>
        <p id="error-message"></p>
        <div class="actions">
          <button id="retry-button" class="secondary" type="button">현재 글 다시 읽기</button>
          <button id="replace-button" class="danger" type="button" hidden>새 key로 다시 시도</button>
          <button id="cleanup-button" class="danger" type="button" hidden>Retry registry 정리</button>
        </div>
      </section>

      <section id="progress-panel" class="card" hidden aria-labelledby="progress-title">
        <h2 id="progress-title">추천 처리 중</h2>
        <p id="progress-message"></p>
        <button id="cancel-button" class="secondary" type="button">취소</button>
      </section>

      <section id="preview-panel" class="card" hidden aria-labelledby="preview-title">
        <h2 id="preview-title" tabindex="-1">전송 전 본문 Preview</h2>
        <dl class="metadata">
          <div><dt>제목</dt><dd id="post-title"></dd></div>
          <div><dt>URL</dt><dd id="post-url"></dd></div>
          <div><dt>본문 길이</dt><dd id="character-count"></dd></div>
        </dl>
        <p id="truncation-notice" class="notice" role="note" hidden></p>
        <details>
          <summary>추출된 본문 미리보기</summary>
          <p id="body-preview" class="body-preview"></p>
        </details>
        <p class="privacy-note">
          전체 본문은 browser storage에 저장되지 않습니다. 추천 요청은 아래 버튼을 누른 뒤에만
          시작됩니다.
        </p>
        <button id="generate-button" class="primary" type="button">추천 댓글 만들기</button>
      </section>

      <section id="review-panel" class="card" hidden aria-labelledby="result-title">
        <h2 id="result-title" tabindex="-1">추천 댓글 검토</h2>
        <p id="review-status" class="badge"></p>
        <p id="review-notice" class="notice" role="status" aria-live="polite" hidden></p>
        <h3>글 요약</h3>
        <p id="summary"></p>
        <ul id="topics" class="topics" aria-label="주요 주제"></ul>
        <fieldset id="candidate-list">
          <legend>댓글 후보 선택</legend>
        </fieldset>
        <label for="edited-comment">선택한 댓글 편집</label>
        <textarea id="edited-comment" rows="6" maxlength="500"></textarea>
        <p id="edit-count" class="help"></p>
        <div class="actions stacked">
          <button id="approve-button" class="primary" type="button">선택한 댓글 승인</button>
          <button id="copy-button" class="secondary" type="button">승인한 댓글 복사</button>
          <button id="complete-button" class="primary" type="button">수동 등록 완료로 표시</button>
        </div>
        <p class="privacy-note">복사와 완료 표시는 댓글을 자동으로 등록하지 않습니다.</p>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
