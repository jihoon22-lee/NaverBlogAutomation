<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이버 블로그 댓글 추천</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main id="app" aria-labelledby="page-title" aria-busy="true">
      <header class="page-header">
        <p class="eyebrow">Naver Blog Comment Assistant</p>
        <h1 id="page-title">댓글 추천</h1>
        <p class="purpose">현재 글을 확인한 뒤, 다음 단계에서 댓글 후보를 요청할 수 있습니다.</p>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">본문을 확인하고 있습니다.</p>

      <section
        id="error-panel"
        class="card error"
        role="alert"
        hidden
        aria-labelledby="error-title"
      >
        <h2 id="error-title" tabindex="-1">본문을 읽지 못했습니다</h2>
        <p id="error-message"></p>
        <button id="retry-button" class="secondary" type="button">다시 읽기</button>
      </section>

      <section id="preview-panel" class="card" hidden aria-labelledby="preview-title">
        <h2 id="preview-title" tabindex="-1">전송 전 본문 Preview</h2>
        <dl class="metadata">
          <div>
            <dt>제목</dt>
            <dd id="post-title"></dd>
          </div>
          <div>
            <dt>URL</dt>
            <dd id="post-url"></dd>
          </div>
          <div>
            <dt>본문 길이</dt>
            <dd id="character-count"></dd>
          </div>
        </dl>
        <p id="truncation-notice" class="notice" role="note" hidden></p>
        <details>
          <summary>추출된 본문 미리보기</summary>
          <p id="body-preview" class="body-preview"></p>
        </details>
        <p class="privacy-note">
          전체 본문은 브라우저 저장소에 저장되지 않습니다. 추천 요청은 사용자가 버튼을 누른
          뒤에만 시작됩니다.
        </p>
        <button
          id="generate-button"
          class="primary"
          type="button"
          aria-describedby="generation-help"
          disabled
        >
          추천 댓글 만들기
        </button>
        <p id="generation-help" class="help">
          OpenAI 연결과 추천 workflow는 다음 구현 단계에서 활성화됩니다.
        </p>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
