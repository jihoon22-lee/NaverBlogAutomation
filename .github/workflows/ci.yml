name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-convention:
    name: Commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            if ! bash scripts/check_commit_message.sh "$subject"; then
              failed=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        id: ruff
        continue-on-error: true
        run: uv run --frozen ruff check --output-format=github .

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: uv run --frozen ruff format --check .

      - name: Type check
        id: ty
        continue-on-error: true
        run: uv run --frozen ty check --output-format=github

      - name: Test
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          uv run --frozen pytest \
            --junitxml=reports/pytest.xml \
            --cov-report=html:htmlcov \
            --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" \
            | tee reports/pytest-output.txt

      - name: Build and smoke-test installed wheel
        id: package
        continue-on-error: true
        shell: bash
        run: |
          wheel_dir="$RUNNER_TEMP/wheel"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --with "$wheel" \
            python scripts/smoke_installed_wheel.py

      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-quality-reports
          path: |
            reports/pytest.xml
            reports/pytest-output.txt
            htmlcov/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce Python quality gate
        if: always()
        shell: bash
        env:
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          FORMAT_RESULT: ${{ steps.formatting.outcome }}
          TY_RESULT: ${{ steps.ty.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: |
          echo "## Python quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ruff | $RUFF_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ruff format | $FORMAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ty | $TY_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pytest + coverage | $PYTEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Wheel install smoke | $PACKAGE_RESULT |" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f reports/pytest-output.txt ]]; then
            echo "### Pytest summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 reports/pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$RUFF_RESULT" != "success" \
            || "$FORMAT_RESULT" != "success" \
            || "$TY_RESULT" != "success" \
            || "$PYTEST_RESULT" != "success" \
            || "$PACKAGE_RESULT" != "success" ]]; then
            echo "One or more Python checks failed." >&2
            exit 1
          fi

  typescript-quality:
    name: TypeScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix extension

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm --prefix extension run format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm --prefix extension run lint

      - name: Type check
        id: types
        continue-on-error: true
        run: npm --prefix extension run typecheck

      - name: Test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm --prefix extension run test:coverage | tee reports/vitest-output.txt

      - name: Build
        id: build
        continue-on-error: true
        run: npm --prefix extension run build

      - name: Upload TypeScript reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-quality-reports
          path: |
            reports/vitest-output.txt
            extension/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce TypeScript quality gate
        if: always()
        shell: bash
        env:
          FORMAT_RESULT: ${{ steps.formatting.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPES_RESULT: ${{ steps.types.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "## TypeScript quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Biome format | $FORMAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Biome lint | $LINT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | $TYPES_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vitest + coverage | $TEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension build | $BUILD_RESULT |" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f reports/vitest-output.txt ]]; then
            echo "### Vitest summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 reports/vitest-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$FORMAT_RESULT" != "success" \
            || "$LINT_RESULT" != "success" \
            || "$TYPES_RESULT" != "success" \
            || "$TEST_RESULT" != "success" \
            || "$BUILD_RESULT" != "success" ]]; then
            echo "One or more TypeScript checks failed." >&2
            exit 1
          fi

  system-e2e:
    name: System E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked extension dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci --prefix extension

      - name: Install bundled Chromium and system dependencies
        id: chromium
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        working-directory: extension
        run: npx playwright install --with-deps chromium

      - name: Build and install wheel in an isolated environment
        id: package
        continue-on-error: true
        shell: bash
        run: |
          wheel_dir="$RUNNER_TEMP/system-e2e-wheel"
          environment="$RUNNER_TEMP/system-e2e-venv"
          uv build --wheel --out-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.14 "$environment"
          uv pip install --python "$environment/bin/python" "$wheel"
          executable="$environment/bin/naver-blog-api"
          test -x "$executable"
          echo "SYSTEM_E2E_API_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Run packaged synthetic workflow
        id: e2e
        if: >-
          steps.dependencies.outcome == 'success' &&
          steps.chromium.outcome == 'success' &&
          steps.package.outcome == 'success'
        continue-on-error: true
        run: npm --prefix extension run test:e2e

      - name: Enforce System E2E gate
        if: always()
        shell: bash
        env:
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
        run: |
          echo "## System E2E gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Locked extension dependencies | $DEPENDENCIES_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Playwright bundled Chromium | $CHROMIUM_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Installed Python wheel | $PACKAGE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Synthetic packaged workflow | $E2E_RESULT |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPENDENCIES_RESULT" != "success" \
            || "$CHROMIUM_RESULT" != "success" \
            || "$PACKAGE_RESULT" != "success" \
            || "$E2E_RESULT" != "success" ]]; then
            echo "System E2E did not complete successfully." >&2
            exit 1
          fi

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - commit-convention
      - python-quality
      - typescript-quality
      - system-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks
        shell: bash
        env:
          COMMIT_RESULT: ${{ needs.commit-convention.result }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-quality.result }}
          E2E_RESULT: ${{ needs.system-e2e.result }}
        run: |
          echo "## Required quality checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit convention | $COMMIT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python quality | $PYTHON_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript quality | $TYPESCRIPT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| System E2E | $E2E_RESULT |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$COMMIT_RESULT" != "success" \
            || "$PYTHON_RESULT" != "success" \
            || "$TYPESCRIPT_RESULT" != "success" \
            || "$E2E_RESULT" != "success" ]]; then
            echo "One or more required jobs failed or were skipped." >&2
            exit 1
          fi
