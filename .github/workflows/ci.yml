name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        id: commit_messages
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            if ! scripts/check_commit_message.sh "$subject"; then
              failed=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Lint
        id: ruff
        continue-on-error: true
        run: uv run --frozen ruff check --output-format=github .

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: uv run --frozen ruff format --check .

      - name: Type check
        id: ty
        continue-on-error: true
        run: uv run --frozen ty check --output-format=github

      - name: Test
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          uv run --frozen pytest \
            --junitxml=reports/pytest.xml \
            --cov-report=html:htmlcov \
            --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" \
            | tee reports/pytest-output.txt

      - name: Check extension formatting
        id: extension_formatting
        continue-on-error: true
        run: npm --prefix extension run format:check

      - name: Lint extension
        id: extension_lint
        continue-on-error: true
        run: npm --prefix extension run lint

      - name: Type check extension
        id: extension_types
        continue-on-error: true
        run: npm --prefix extension run typecheck

      - name: Test extension
        id: extension_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm --prefix extension run test:coverage | tee reports/vitest-output.txt

      - name: Build extension
        id: extension_build
        continue-on-error: true
        run: npm --prefix extension run build

      - name: Upload detailed test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            reports/pytest.xml
            reports/pytest-output.txt
            reports/vitest-output.txt
            htmlcov/
            extension/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce quality gate
        if: always()
        shell: bash
        env:
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          FORMAT_RESULT: ${{ steps.formatting.outcome }}
          TY_RESULT: ${{ steps.ty.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
          COMMIT_RESULT: ${{ steps.commit_messages.outcome }}
          EXT_FORMAT_RESULT: ${{ steps.extension_formatting.outcome }}
          EXT_LINT_RESULT: ${{ steps.extension_lint.outcome }}
          EXT_TYPES_RESULT: ${{ steps.extension_types.outcome }}
          EXT_TEST_RESULT: ${{ steps.extension_tests.outcome }}
          EXT_BUILD_RESULT: ${{ steps.extension_build.outcome }}
        run: |
          echo "## Quality gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit messages | $COMMIT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ruff | $RUFF_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ruff format | $FORMAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ty | $TY_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pytest + coverage | $PYTEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension format | $EXT_FORMAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension lint | $EXT_LINT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension types | $EXT_TYPES_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension tests + coverage | $EXT_TEST_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extension build | $EXT_BUILD_RESULT |" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f reports/pytest-output.txt ]]; then
            echo "### Pytest summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 reports/pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f reports/vitest-output.txt ]]; then
            echo "### Extension test summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 reports/vitest-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$COMMIT_RESULT" != "success" \
            || "$RUFF_RESULT" != "success" \
            || "$FORMAT_RESULT" != "success" \
            || "$TY_RESULT" != "success" \
            || "$PYTEST_RESULT" != "success" \
            || "$EXT_FORMAT_RESULT" != "success" \
            || "$EXT_LINT_RESULT" != "success" \
            || "$EXT_TYPES_RESULT" != "success" \
            || "$EXT_TEST_RESULT" != "success" \
            || "$EXT_BUILD_RESULT" != "success" ]]; then
            echo "One or more required checks failed." >&2
            exit 1
          fi
