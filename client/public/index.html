<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f766e" />
    <title>네이버 블로그 댓글 작성 보조 도구</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <header>
      <h1>네이버 블로그 댓글 작성 보조 도구</h1>
      <nav id="workspace-nav" aria-label="작업 화면">
        <button type="button" data-section="today" aria-current="page">오늘의 작업</button>
        <button type="button" data-section="session">여러 글 처리</button>
        <button type="button" data-section="writing">글 작성</button>
        <button type="button" data-section="activity">최근 작업</button>
        <button type="button" data-section="settings">설정</button>
        <button type="button" id="remote-pairing-code-button">태블릿 연결</button>
      </nav>
    </header>
    <main id="workspace" aria-live="polite"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
