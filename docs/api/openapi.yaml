openapi: 3.1.0
info:
  title: Naver Blog Assistant Local API
  version: 1.0.0
  description: >-
    Loopback-only API used by the browser extension Side Panel to create and review
    human-approved comment recommendations. Full article text is accepted only after preview
    confirmation and is not retained in full.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8765
    description: Local machine only
tags:
  - name: System
    description: Local process diagnostics.
  - name: Recommendations
    description: Generate, retrieve, and review comment recommendations.
  - name: Personalization
    description: Control the local completed-comment style sample set.
  - name: Discovery
    description: Local, user-reviewed blog discovery queues and digest settings.
security: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check process health
      responses:
        "200":
          description: The local API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/status:
    get:
      operationId: getServiceStatus
      tags: [System]
      summary: Report the local runtime configuration without secrets
      responses:
        "200":
          description: The local service and its database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/recommendations:
    get:
      operationId: listRecommendations
      tags: [Recommendations]
      summary: List recent local recommendation history without source bodies
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Recent recommendations ordered by latest activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationHistoryResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createRecommendation
      tags: [Recommendations]
      summary: Generate three comment recommendations for the previewed active blog post
      description: >-
        The Side Panel persists one idempotency key before its first attempt and reuses it for
        duplicate clicks, interrupted responses, timeouts, and in-progress retries whenever the
        exact normalized payload remains available.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendationRequest"
      responses:
        "201":
          description: A recommendation was generated and stored.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "200":
          description: A prior completed response was replayed for the same request.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GenerationTimeout"
  /api/v1/recommendations/{recommendation_id}:
    parameters:
      - $ref: "#/components/parameters/RecommendationId"
    get:
      operationId: getRecommendation
      tags: [Recommendations]
      summary: Get a stored recommendation without the source body
      responses:
        "200":
          description: The recommendation was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteRecommendation
      tags: [Recommendations]
      summary: Delete one recommendation and its retry metadata
      responses:
        "204":
          description: The local recommendation was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      operationId: reviewRecommendation
      tags: [Recommendations]
      summary: Record the user's explicit Side Panel review decision
      description: >-
        Review remains human controlled. Copying a comment does not itself mark the recommendation
        completed. On a review conflict, the client fetches the latest representation before
        retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationRequest"
      responses:
        "200":
          description: The review state was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/personalization/examples:
    delete:
      operationId: clearPersonalizationExamples
      tags: [Personalization]
      summary: Exclude all completed comments from future style-example use
      description: >-
        Preserves local recommendation history while preventing every completed comment from being
        sent as a future provider style example.
      responses:
        "204":
          description: Completed comments were excluded from future personalization.
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/discovery/neighbors:
    get:
      operationId: listDiscoveryNeighbors
      tags: [Discovery]
      responses:
        "200": {description: Stored neighbor blogs.}
    post:
      operationId: saveDiscoveryNeighbor
      tags: [Discovery]
      responses:
        "201": {description: Neighbor blog saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/searches:
    get:
      operationId: listDiscoverySearches
      tags: [Discovery]
      responses:
        "200": {description: Stored search profiles.}
    post:
      operationId: saveDiscoverySearch
      tags: [Discovery]
      responses:
        "201": {description: Search profile saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/searches/{search_id}/refresh:
    post:
      operationId: refreshDiscoverySearch
      tags: [Discovery]
      description: Refresh one saved search through the configured documented Naver Search API.
      responses:
        "200": {description: Saved search metadata refreshed.}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Naver Search API credentials are not configured.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/import:
    post:
      operationId: importDiscoveryPosts
      tags: [Discovery]
      responses:
        "200": {description: User-opened page metadata was imported.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/queue:
    get:
      operationId: listDiscoveryQueue
      tags: [Discovery]
      responses:
        "200": {description: Queue items for one discovery source.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/queue/{post_id}:
    patch:
      operationId: updateDiscoveryPostState
      tags: [Discovery]
      responses:
        "200": {description: Discovery post state updated.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/automation-settings:
    get:
      operationId: getAutomaticDiscoverySettings
      tags: [Discovery]
      responses:
        "200": {description: Current automatic discovery settings.}
    put:
      operationId: saveAutomaticDiscoverySettings
      tags: [Discovery]
      responses:
        "200": {description: Automatic discovery settings saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/sync:
    post:
      operationId: syncAutomaticDiscovery
      tags: [Discovery]
      responses:
        "200": {description: Public discovery sources synchronized.}
  /api/v1/discovery/digest-settings:
    get:
      operationId: getDiscoveryDigestSettings
      tags: [Discovery]
      responses:
        "200": {description: Current local digest schedule.}
    put:
      operationId: saveDiscoveryDigestSettings
      tags: [Discovery]
      responses:
        "200": {description: Digest schedule saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/refresh-neighbors:
    post:
      operationId: refreshDiscoveryNeighbors
      tags: [Discovery]
      responses:
        "200": {description: Public neighbor RSS feeds were refreshed.}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once for one user-initiated generation request.
      schema:
        type: string
        format: uuid
    RecommendationId:
      name: recommendation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    IdempotencyReplayed:
      description: True when returning a stored success or safe failure for a repeated request.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds before a definitely rejected request may be retried.
      schema:
        type: integer
        minimum: 0
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ServiceStatusResponse:
      type: object
      additionalProperties: false
      required: [status, api_version, app_environment, database, generator_mode, generator_model]
      properties:
        status:
          type: string
          const: ready
        api_version:
          type: string
        app_environment:
          type: string
          enum: [production, development, test]
        database:
          type: string
          const: ready
        generator_mode:
          type: string
          enum: [openai, fake]
        generator_model:
          type: string
          minLength: 1
          maxLength: 300
    CreateRecommendationRequest:
      type: object
      additionalProperties: false
      required: [source_url, title, body]
      properties:
        source_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL on an explicitly supported Naver Blog host.
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 20
          maxLength: 100000
          description: Visible article text; processed in memory and not retained in full.
        relationship_level:
          type: string
          enum: [new, polite, friendly, close]
          default: friendly
          description: The writer relationship used to calibrate the draft.
        speech_style:
          type: string
          enum: [honorific, banmal]
          default: honorific
          description: Korean speech style; banmal is valid only for a close relationship.
        comment_length:
          type: string
          enum: [short, medium, long]
          default: medium
          description: Target comment length; short is 40-80, medium is 100-160, and long is 200-320 characters.
        comment_mood:
          type: string
          enum: [calm, warm, lively]
          default: warm
          description: Overall expressive mood applied to all three role-specific candidates.
        personalization_mode:
          type: string
          enum: [off, completed_examples]
          default: completed_examples
          description: Whether the local service may send up to five eligible completed comments as style examples.
    RecommendationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - source_url
        - title
        - summary
        - topics
        - candidates
        - relationship_level
        - speech_style
        - comment_length
        - comment_mood
        - quality_warnings
        - personalization_applied
        - personalization_mode
        - personalization_sample_count
        - personalization_eligible
        - review_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 800
        topics:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
        candidates:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/CommentCandidate"
        relationship_level:
          type: string
          enum: [new, polite, friendly, close]
        speech_style:
          type: string
          enum: [honorific, banmal]
        comment_length:
          type: string
          enum: [short, medium, long]
        comment_mood:
          type: string
          enum: [calm, warm, lively]
        quality_warnings:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [length_target_missed, candidate_roles_blurred, candidates_too_similar]
        personalization_applied:
          type: boolean
        personalization_mode:
          type: string
          enum: [off, completed_examples]
        personalization_sample_count:
          type: integer
          minimum: 0
          maximum: 5
        personalization_eligible:
          type: boolean
        selected_candidate_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          default: null
        edited_comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
          default: null
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          default: null
    RecommendationHistoryResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecommendationHistoryItemResponse"
    RecommendationHistoryItemResponse:
      type: object
      additionalProperties: false
      required: [id, source_url, title, review_status, comment, created_at, updated_at, personalization_eligible]
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        title:
          type: string
          minLength: 1
          maxLength: 300
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          default: null
        personalization_eligible:
          type: boolean
    CommentCandidate:
      type: object
      additionalProperties: false
      required: [id, tone, comment, referenced_detail]
      properties:
        id:
          type: string
          format: uuid
        tone:
          type: string
          enum: [warm, curious, supportive]
        comment:
          type: string
          minLength: 1
          maxLength: 500
        referenced_detail:
          type: string
          minLength: 1
          maxLength: 300
          description: Concise article detail grounding this candidate.
    ReviewStatus:
      type: string
      enum: [drafted, approved, completed]
    ReviewRecommendationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        selected_candidate_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        edited_comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        personalization_eligible:
          type: boolean
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 1000
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: The HTTP request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The requested recommendation does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Idempotency, review, active generation, or indeterminate state conflict.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReviewConflict:
      description: The requested review conflicts with the stored state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The HTTP request exceeds the configured body limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationError:
      description: The request is invalid or uses an unsupported source URL.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Local or model-provider rate limiting prevented generation.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GenerationFailed:
      description: The model response was refused or could not be validated.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unavailable:
      description: A required local or provider dependency is unavailable.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GenerationTimeout:
      description: Model generation did not finish within the configured timeout.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
