openapi: 3.1.0
info:
  title: Naver Blog Assistant Local API
  version: 1.0.0
  description: >-
    Loopback-only API used by the browser extension Side Panel to create and review
    human-approved comment recommendations. Full article text is accepted only after preview
    confirmation and is not retained in full.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8765
    description: Local machine only
tags:
  - name: System
    description: Local process diagnostics.
  - name: Recommendations
    description: Generate, retrieve, and review comment recommendations.
  - name: Personalization
    description: Control the local completed-comment style sample set.
  - name: Engagement
    description: Persist one explicitly approved post engagement and its ordered external-action results.
  - name: Discovery
    description: Local, user-reviewed blog discovery queues and digest settings.
  - name: Settings
    description: >-
      Versioned local web app settings. The frozen extension keeps its own browser storage; these
      records exist so the unattended scheduler can read the same preferences.
  - name: Automation
    description: >-
      Control the single locally owned browser session. The user signs in manually in that window;
      the service never reads credentials or cookies.
security: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check process health
      responses:
        "200":
          description: The local API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/status:
    get:
      operationId: getServiceStatus
      tags: [System]
      summary: Report the local runtime configuration without secrets
      responses:
        "200":
          description: The local service and its database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/recommendations:
    get:
      operationId: listRecommendations
      tags: [Recommendations]
      summary: List recent local recommendation history without source bodies
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Recent recommendations ordered by latest activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationHistoryResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createRecommendation
      tags: [Recommendations]
      summary: Generate three comment recommendations for the previewed active blog post
      description: >-
        The Side Panel persists one idempotency key before its first attempt and reuses it for
        duplicate clicks, interrupted responses, timeouts, and in-progress retries whenever the
        exact normalized payload remains available.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendationRequest"
      responses:
        "201":
          description: A recommendation was generated and stored.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "200":
          description: A prior completed response was replayed for the same request.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GenerationFailed"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GenerationTimeout"
  /api/v1/recommendations/{recommendation_id}:
    parameters:
      - $ref: "#/components/parameters/RecommendationId"
    get:
      operationId: getRecommendation
      tags: [Recommendations]
      summary: Get a stored recommendation without the source body
      responses:
        "200":
          description: The recommendation was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteRecommendation
      tags: [Recommendations]
      summary: Delete one recommendation and its retry metadata
      responses:
        "204":
          description: The local recommendation was deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      operationId: reviewRecommendation
      tags: [Recommendations]
      summary: Record the user's explicit Side Panel review decision
      description: >-
        Review remains human controlled. Copying a comment does not itself mark the recommendation
        completed. On a review conflict, the client fetches the latest representation before
        retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationRequest"
      responses:
        "200":
          description: The review state was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReviewConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/personalization/examples:
    delete:
      operationId: clearPersonalizationExamples
      tags: [Personalization]
      summary: Exclude all completed comments from future style-example use
      description: >-
        Preserves local recommendation history while preventing every completed comment from being
        sent as a future provider style example.
      responses:
        "204":
          description: Completed comments were excluded from future personalization.
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/engagement-runs:
    get:
      operationId: listEngagementRuns
      tags: [Engagement]
      summary: List recent engagement runs without comment or request-message content
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Recent engagement runs ordered by latest activity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunListResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
    post:
      operationId: startEngagementRun
      tags: [Engagement]
      summary: Start or resume the run bound to one final approval and discovery post
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EngagementRunStartRequest"}
      responses:
        "201":
          description: A new engagement run was stored.
          headers:
            Engagement-Replayed: {$ref: "#/components/headers/EngagementReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "200":
          description: The existing run for this approval or discovery post was returned.
          headers:
            Engagement-Replayed: {$ref: "#/components/headers/EngagementReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EngagementConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/engagement-runs/by-post/{post_id}:
    get:
      operationId: getEngagementRunForPost
      tags: [Engagement]
      parameters:
        - {name: post_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The run bound to this discovery post.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {description: Validation Error}
  /api/v1/engagement-runs/{run_id}:
    get:
      operationId: getEngagementRun
      tags: [Engagement]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The stored engagement run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {description: Validation Error}
  /api/v1/engagement-runs/{run_id}/manual-completion:
    post:
      operationId: completeEngagementManually
      tags: [Engagement]
      description: Record only the steps a user confirms were completed manually; no browser action is repeated.
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualEngagementCompletionRequest"}
      responses:
        "200":
          description: The manually finalized engagement run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EngagementConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/engagement-runs/{run_id}/steps/{step_name}:
    patch:
      operationId: transitionEngagementStep
      tags: [Engagement]
      summary: Persist the start or terminal result of one ordered external action
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: step_name, in: path, required: true, schema: {type: string, enum: [like, comment, mutual_neighbor]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EngagementStepTransitionRequest"}
      responses:
        "200":
          description: The transition was stored and the aggregate run was returned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementRunResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EngagementConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/neighbors:
    get:
      operationId: listDiscoveryNeighbors
      tags: [Discovery]
      responses:
        "200": {description: Stored neighbor blogs.}
    post:
      operationId: saveDiscoveryNeighbor
      tags: [Discovery]
      responses:
        "201": {description: Neighbor blog saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/searches:
    get:
      operationId: listDiscoverySearches
      tags: [Discovery]
      responses:
        "200": {description: Stored search profiles.}
    post:
      operationId: saveDiscoverySearch
      tags: [Discovery]
      responses:
        "201": {description: Search profile saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/searches/{search_id}/refresh:
    post:
      operationId: refreshDiscoverySearch
      tags: [Discovery]
      description: Refresh one saved search through the configured documented Naver Search API.
      responses:
        "200": {description: Saved search metadata refreshed.}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/DiscoverySearchNotConfigured"}
        "422": {description: Validation Error}
  /api/v1/discovery/searches/{search_id}:
    delete:
      operationId: deleteDiscoverySearch
      tags: [Discovery]
      description: Delete only the saved search profile. Previously discovered candidates remain available.
      parameters:
        - {name: search_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Saved search deleted.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {description: Validation Error}
  /api/v1/discovery/import:
    post:
      operationId: importDiscoveryPosts
      tags: [Discovery]
      responses:
        "200": {description: User-opened page metadata was imported.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/queue:
    get:
      operationId: listDiscoveryQueue
      tags: [Discovery]
      responses:
        "200": {description: Queue items for one discovery source.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/queue/{post_id}:
    patch:
      operationId: updateDiscoveryPostState
      tags: [Discovery]
      responses:
        "200": {description: Discovery post state updated.}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/automation-settings:
    get:
      operationId: getAutomaticDiscoverySettings
      tags: [Discovery]
      responses:
        "200": {description: Current automatic discovery settings.}
    put:
      operationId: saveAutomaticDiscoverySettings
      tags: [Discovery]
      responses:
        "200": {description: Automatic discovery settings saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/sync:
    post:
      operationId: syncAutomaticDiscovery
      tags: [Discovery]
      responses:
        "200": {description: Public discovery sources synchronized.}
  /api/v1/discovery/digest-settings:
    get:
      operationId: getDiscoveryDigestSettings
      tags: [Discovery]
      responses:
        "200": {description: Current local digest schedule.}
    put:
      operationId: saveDiscoveryDigestSettings
      tags: [Discovery]
      responses:
        "200": {description: Digest schedule saved.}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/discovery/refresh-neighbors:
    post:
      operationId: refreshDiscoveryNeighbors
      tags: [Discovery]
      responses:
        "200": {description: Public neighbor RSS feeds were refreshed.}
  /api/v1/automation/session:
    get:
      operationId: getBrowserSession
      tags: [Automation]
      summary: Report the locally owned browser session without secrets
      parameters:
        - name: refresh
          in: query
          required: false
          description: Re-observe the public sign-in state on a live session.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Current automation session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
  /api/v1/automation/session/launch:
    post:
      operationId: launchBrowserSession
      tags: [Automation]
      summary: Start the dedicated-profile browser window for manual sign-in
      responses:
        "200":
          description: The session is ready and its sign-in state was observed once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "503": {$ref: "#/components/responses/BrowserUnavailable"}
  /api/v1/automation/session/close:
    post:
      operationId: closeBrowserSession
      tags: [Automation]
      summary: Close the browser session and release the profile lock
      responses:
        "200":
          description: The session was closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
  /api/v1/automation/session/focus:
    post:
      operationId: focusBrowserSession
      tags: [Automation]
      summary: Raise the automation window so the user can act on it
      responses:
        "200":
          description: The window was raised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
  /api/v1/automation/session/screenshot:
    get:
      operationId: captureBrowserSession
      tags: [Automation]
      summary: Return one in-memory capture of the automation tab
      description: >-
        The capture can contain article text and the signed-in account view, so it is streamed from
        memory and never written to disk, logs, or CI artifacts.
      responses:
        "200":
          description: One in-memory PNG capture of the automation tab.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
  /api/v1/automation/engagement-runs:
    post:
      operationId: startAutomationRun
      tags: [Automation]
      summary: Start the reviewed actions for one approved post
      description: >-
        One explicit approval starts one run. The response returns the persisted run immediately and
        progress arrives on the event stream, so a long browser sequence never blocks this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRunRequest"
      responses:
        "202":
          description: The run was accepted and is executing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementRunResponse"
        "403": {$ref: "#/components/responses/ConsentRequired"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/EngagementConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/automation/engagement-runs/{run_id}/events:
    get:
      operationId: streamAutomationRunEvents
      tags: [Automation]
      summary: Stream step progress for one run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server-sent step progress for one run.
          content:
            text/event-stream:
              schema:
                type: string
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/automation/extract:
    post:
      operationId: extractArticle
      tags: [Automation]
      summary: Capture one supported post through the automation session
      description: >-
        The supported-host policy is enforced by the service, not by the injected script. The full
        body is held in memory for the generation request; only a bounded preview is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleExtractionRequest"
      responses:
        "200":
          description: The strongest capture across eligible frames.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleExtractionResponse"
        "409": {$ref: "#/components/responses/BrowserSessionConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
        "503": {$ref: "#/components/responses/BrowserUnavailable"}
  /api/v1/automation/comments:
    post:
      operationId: generateComment
      tags: [Automation]
      summary: Generate comment candidates for one supported post
      description: >-
        The service extracts the post itself, applies the saved generation profile for options the
        request omits, and derives its own idempotency key. Duplicate requests, interrupted
        responses, and timeouts reuse that key; a replacement attempt requires `replace: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentGenerationRequest"
      responses:
        "200":
          description: The stored recommendation for this request.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentGenerationResponse"
        "409": {$ref: "#/components/responses/GenerationConflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "502": {$ref: "#/components/responses/BrowserOperationFailed"}
        "503": {$ref: "#/components/responses/BrowserUnavailable"}
        "504": {$ref: "#/components/responses/GenerationTimeout"}
  /api/v1/llm/providers:
    get:
      operationId: listLlmProviders
      tags: [Generation]
      summary: Report which generation providers this process can call
      description: Reports configuration state only. API keys never appear in a response.
      responses:
        "200":
          description: Every known provider in declaration order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvidersResponse"
  /api/v1/settings/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
            - generation_profile
            - closing_phrase
            - neighbor_message
            - automation_consent
            - safety_policy
            - schedule_policy
            - browser_profile
            - llm_providers
    get:
      operationId: getAppSetting
      tags: [Settings]
      summary: Read one settings record or its documented default
      responses:
        "200":
          description: The effective settings record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettingResponse"
        "404": {$ref: "#/components/responses/SettingNotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    put:
      operationId: saveAppSetting
      tags: [Settings]
      summary: Replace one settings record after service-side validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingRequest"
      responses:
        "200":
          description: The stored settings record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettingResponse"
        "404": {$ref: "#/components/responses/SettingNotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once for one user-initiated generation request.
      schema:
        type: string
        format: uuid
    RecommendationId:
      name: recommendation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    IdempotencyReplayed:
      description: True when returning a stored success or safe failure for a repeated request.
      schema:
        type: boolean
    EngagementReplayed:
      description: True when an existing run was returned without creating another run.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds before a definitely rejected request may be retried.
      schema:
        type: integer
        minimum: 0
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ServiceStatusResponse:
      type: object
      additionalProperties: false
      required: [status, api_version, app_environment, database, generator_mode, generator_model]
      properties:
        status:
          type: string
          const: ready
        api_version:
          type: string
        app_environment:
          type: string
          enum: [production, development, test]
        database:
          type: string
          const: ready
        generator_mode:
          type: string
          enum: [openai, fake]
        generator_model:
          type: string
          minLength: 1
          maxLength: 300
    CreateRecommendationRequest:
      type: object
      additionalProperties: false
      required: [source_url, title, body]
      properties:
        source_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL on an explicitly supported Naver Blog host.
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 20
          maxLength: 100000
          description: Visible article text; processed in memory and not retained in full.
        relationship_level:
          type: string
          enum: [new, polite, friendly, close]
          default: friendly
          description: The writer relationship used to calibrate the draft.
        speech_style:
          type: string
          enum: [honorific, banmal]
          default: honorific
          description: Korean speech style; banmal is valid only for a close relationship.
        comment_length:
          type: string
          enum: [short, medium, long]
          default: medium
          description: Target comment length; short is 40-80, medium is 100-160, and long is 200-320 characters.
        comment_mood:
          type: string
          enum: [calm, warm, lively]
          default: warm
          description: Overall expressive mood applied to all three role-specific candidates.
        personalization_mode:
          type: string
          enum: [off, completed_examples]
          default: completed_examples
          description: Whether the local service may send up to five eligible completed comments as style examples.
    RecommendationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - source_url
        - title
        - summary
        - topics
        - candidates
        - relationship_level
        - speech_style
        - comment_length
        - comment_mood
        - quality_warnings
        - personalization_applied
        - personalization_mode
        - personalization_sample_count
        - personalization_eligible
        - review_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 300
        summary:
          type: string
          minLength: 1
          maxLength: 800
        topics:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
        candidates:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/CommentCandidate"
        relationship_level:
          type: string
          enum: [new, polite, friendly, close]
        speech_style:
          type: string
          enum: [honorific, banmal]
        comment_length:
          type: string
          enum: [short, medium, long]
        comment_mood:
          type: string
          enum: [calm, warm, lively]
        quality_warnings:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [length_target_missed, candidate_roles_blurred, candidates_too_similar]
        personalization_applied:
          type: boolean
        personalization_mode:
          type: string
          enum: [off, completed_examples]
        personalization_sample_count:
          type: integer
          minimum: 0
          maximum: 5
        personalization_eligible:
          type: boolean
        selected_candidate_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          default: null
        edited_comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
          default: null
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          default: null
    RecommendationHistoryResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecommendationHistoryItemResponse"
    RecommendationHistoryItemResponse:
      type: object
      additionalProperties: false
      required: [id, source_url, title, review_status, comment, created_at, updated_at, personalization_eligible]
      properties:
        id:
          type: string
          format: uuid
        source_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        title:
          type: string
          minLength: 1
          maxLength: 300
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          default: null
        personalization_eligible:
          type: boolean
    CommentCandidate:
      type: object
      additionalProperties: false
      required: [id, tone, comment, referenced_detail]
      properties:
        id:
          type: string
          format: uuid
        tone:
          type: string
          enum: [warm, curious, supportive]
        comment:
          type: string
          minLength: 1
          maxLength: 500
        referenced_detail:
          type: string
          minLength: 1
          maxLength: 300
          description: Concise article detail grounding this candidate.
    ReviewStatus:
      type: string
      enum: [drafted, approved, completed]
    ReviewRecommendationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        selected_candidate_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        edited_comment:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: "null"
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        personalization_eligible:
          type: boolean
    EngagementRunStartRequest:
      type: object
      additionalProperties: false
      required: [approval_id, discovery_post_id, recommendation_id]
      properties:
        approval_id: {type: string, format: uuid}
        discovery_post_id: {type: string, format: uuid}
        recommendation_id: {type: string, format: uuid}
    ManualEngagementCompletionRequest:
      type: object
      additionalProperties: false
      required: [completed_steps]
      properties:
        completed_steps:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [like, comment, mutual_neighbor]}
    EngagementStepTransitionRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [running, succeeded, skipped, failed, unconfirmed]
        result_code:
          oneOf:
            - {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
            - {type: "null"}
          default: null
    EngagementRunListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/EngagementRunResponse"}
    EngagementRunResponse:
      type: object
      additionalProperties: false
      required:
        [id, approval_id, discovery_post_id, recommendation_id, source, state, steps, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: string, format: uuid}
        discovery_post_id: {type: string, format: uuid}
        recommendation_id: {type: string, format: uuid}
        source: {type: string, enum: [neighbor, search]}
        state: {type: string, enum: [running, succeeded, failed, unconfirmed]}
        steps:
          type: array
          minItems: 2
          maxItems: 3
          items: {$ref: "#/components/schemas/EngagementStepResponse"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EngagementStepResponse:
      type: object
      additionalProperties: false
      required: [name, position, state, result_code, updated_at]
      properties:
        name: {type: string, enum: [like, comment, mutual_neighbor]}
        position: {type: integer, minimum: 0, maximum: 2}
        state:
          type: string
          enum: [pending, running, succeeded, skipped, failed, unconfirmed]
        result_code:
          oneOf:
            - {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
            - {type: "null"}
        updated_at: {type: string, format: date-time}
    AutomationRunRequest:
      type: object
      additionalProperties: false
      required: [discovery_post_id, recommendation_id]
      properties:
        discovery_post_id:
          type: string
          format: uuid
        recommendation_id:
          type: string
          format: uuid
    CommentGenerationRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        relationship_level:
          oneOf:
            - {type: string, enum: [new, polite, friendly, close]}
            - {type: "null"}
        speech_style:
          oneOf:
            - {type: string, enum: [honorific, banmal]}
            - {type: "null"}
        comment_length:
          oneOf:
            - {type: string, enum: [short, medium, long]}
            - {type: "null"}
        comment_mood:
          oneOf:
            - {type: string, enum: [calm, warm, lively]}
            - {type: "null"}
        personalization_mode:
          oneOf:
            - {type: string, enum: [off, completed_examples]}
            - {type: "null"}
        replace:
          type: boolean
          default: false
          description: Start a new attempt after accepting that the prior provider result is unknown.
    CommentGenerationResponse:
      type: object
      additionalProperties: false
      required: [attempt, extraction, recommendation, replayed]
      properties:
        attempt:
          type: integer
          minimum: 1
        extraction:
          $ref: "#/components/schemas/ArticleExtractionResponse"
        recommendation:
          $ref: "#/components/schemas/RecommendationResponse"
        replayed:
          type: boolean
    AppSettingRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          type: object
          description: Kind-specific settings values validated by the service.
    LlmProviderResponse:
      type: object
      additionalProperties: false
      required: [provider, configured, model]
      properties:
        provider: {type: string, enum: [openai, gemini, anthropic]}
        configured: {type: boolean}
        model: {type: string, minLength: 1, maxLength: 100}
    LlmProvidersResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/LlmProviderResponse"}
    AppSettingResponse:
      type: object
      additionalProperties: false
      required: [kind, schema_version, payload, updated_at]
      properties:
        kind:
          type: string
          enum:
            - generation_profile
            - closing_phrase
            - neighbor_message
            - automation_consent
            - safety_policy
            - schedule_policy
            - browser_profile
            - llm_providers
        schema_version:
          type: integer
          minimum: 1
        payload:
          type: object
        updated_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    ArticleExtractionRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: HTTPS URL on an explicitly supported Naver Blog host.
    ArticleExtractionResponse:
      type: object
      additionalProperties: false
      required:
        [source_url, title, selector_kind, original_length, transmitted_length, truncated, preview]
      properties:
        source_url:
          type: string
          minLength: 1
          maxLength: 2048
        title:
          type: string
          minLength: 1
          maxLength: 300
        selector_kind:
          type: string
          enum: [modern, legacy, semantic]
        original_length:
          type: integer
          minimum: 0
        transmitted_length:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        preview:
          type: string
          maxLength: 1200
          description: Bounded excerpt for human review; the full body is never returned.
    BrowserSessionResponse:
      type: object
      additionalProperties: false
      required: [state, login, driver, headless, profile_dir, open_pages]
      properties:
        state:
          type: string
          enum: [stopped, launching, ready, closing]
        login:
          type: string
          enum: [unknown, anonymous, authenticated]
          description: Observed from public sign-in affordances only; never from cookies.
        driver:
          type: string
          minLength: 1
          maxLength: 32
        headless:
          type: boolean
        profile_dir:
          type: string
          minLength: 1
          maxLength: 1024
          description: Dedicated persistent profile path, separate from the everyday browser profile.
        open_pages:
          type: integer
          minimum: 0
        detail:
          oneOf:
            - {type: string}
            - {type: "null"}
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 1000
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    InvalidRequest:
      description: The HTTP request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: The requested recommendation does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Idempotency, review, active generation, or indeterminate state conflict.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReviewConflict:
      description: The requested review conflicts with the stored state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    EngagementConflict:
      description: The engagement source binding, order, or requested step transition conflicts with stored state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DiscoverySearchNotConfigured:
      description: Naver Search API credentials are not configured.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: The HTTP request exceeds the configured body limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationError:
      description: The request is invalid or uses an unsupported source URL.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Local or model-provider rate limiting prevented generation.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GenerationFailed:
      description: The model response was refused or could not be validated.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unavailable:
      description: A required local or provider dependency is unavailable.
      headers:
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GenerationTimeout:
      description: Model generation did not finish within the configured timeout.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ConsentRequired:
      description: Automation consent has not been accepted for the current version.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    GenerationConflict:
      description: Generation is in progress, indeterminate, or the key was reused for other content.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    SettingNotFound:
      description: The requested settings kind does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BrowserSessionConflict:
      description: The browser session lifecycle state does not allow this request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BrowserUnavailable:
      description: The configured browser driver or browser binary could not start.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BrowserOperationFailed:
      description: A live browser navigation, evaluation, or capture failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
